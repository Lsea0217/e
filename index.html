<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクリエイトプラットフォーム（小説・掲示板・保管庫）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-feather-pointed"></i> クリエイターHub
            </h1>
            <div id="storage-status" class="text-xs bg-indigo-700 px-2 py-1 rounded text-indigo-200">
                <i class="fa-solid fa-database"></i> 起動中...
            </div>
        </div>
        <!-- ナビゲーションタブ -->
        <nav class="bg-indigo-700 px-4 flex overflow-x-auto text-sm">
            <button onclick="switchTab('novel')" id="btn-novel" class="tab-btn px-4 py-2.5 font-medium border-b-2 border-white text-white whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-book-open"></i> 小説スタジオ
            </button>
            <button onclick="switchTab('board')" id="btn-board" class="tab-btn px-4 py-2.5 font-medium border-b-2 border-transparent text-indigo-200 hover:text-white whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-comments"></i> 掲示板
            </button>
            <button onclick="switchTab('vault')" id="btn-vault" class="tab-btn px-4 py-2.5 font-medium border-b-2 border-transparent text-indigo-200 hover:text-white whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-vault"></i> 画像保管庫
            </button>
            <button onclick="switchTab('settings')" id="btn-settings" class="tab-btn px-4 py-2.5 font-medium border-b-2 border-transparent text-indigo-200 hover:text-white whitespace-nowrap flex items-center gap-1.5">
                <i class="fa-solid fa-gear"></i> バックアップ
            </button>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6">

        <!-- ================= 小説スタジオ ================= -->
        <section id="tab-novel" class="tab-content active space-y-6">
            <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-700">小説一覧 / 作成</h2>
                    <p class="text-xs text-slate-500">1つの小説の中に複数の場面（タブ）と画像を自由に挿入できます。</p>
                </div>
                <button onclick="openNewNovelModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新規小説作成
                </button>
            </div>

            <!-- 小説一覧リスト -->
            <div id="novel-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 動的生成 -->
            </div>

            <!-- 小説エディタビュー（初期非表示） -->
            <div id="novel-editor-view" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <button onclick="backToNovelList()" class="text-sm text-indigo-600 hover:underline mb-1 inline-flex items-center gap-1">
                            <i class="fa-solid fa-arrow-left"></i> 小説一覧に戻る
                        </button>
                        <h3 id="editor-novel-title" class="text-xl font-bold text-slate-800"></h3>
                    </div>
                    <button onclick="saveCurrentNovelData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> 変更を保存
                    </button>
                </div>

                <!-- 場面（タブ）切り替えバー -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b" id="scene-tabs-container">
                    <!-- 場面タブがここに並ぶ -->
                </div>

                <!-- 選択中の場面の編集エリア -->
                <div id="scene-editor-panel" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">場面（章）タイトル</label>
                        <input type="text" id="scene-title-input" oninput="updateActiveSceneTitle(this.value)" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="例：第1章 出会いの予感">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">文章・本文</label>
                        <textarea id="scene-content-input" rows="8" oninput="updateActiveSceneContent(this.value)" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none leading-relaxed" placeholder="ここに文章を入力してください..."></textarea>
                    </div>

                    <!-- 場面ごとの画像挿入エリア -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="text-sm font-bold text-slate-700"><i class="fa-solid fa-images"></i> この場面の挿入画像</h4>
                            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition inline-flex items-center gap-1.5">
                                <i class="fa-solid fa-upload"></i> 画像を追加
                                <input type="file" accept="image/*" class="hidden" onchange="addSceneImage(event)">
                            </label>
                        </div>
                        <div id="scene-images-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            <!-- 画像プレビュー -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 掲示板 ================= -->
        <section id="tab-board" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-700"><i class="fa-solid fa-pen-to-square"></i> 新規投稿</h2>
                <textarea id="board-text" rows="3" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="いまなにしてる？文章と画像を自由に投稿できます..."></textarea>
                
                <div class="flex flex-wrap justify-between items-center gap-4">
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-medium transition inline-flex items-center gap-1.5 border">
                            <i class="fa-solid fa-image text-indigo-600"></i> 画像添付
                            <input type="file" id="board-file" accept="image/*" class="hidden" onchange="previewBoardImage(event)">
                        </label>
                        <span id="board-file-name" class="text-xs text-slate-500"></span>
                    </div>
                    <button onclick="submitBoardPost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                        投稿する
                    </button>
                </div>
                <div id="board-img-preview" class="hidden relative w-24 h-24 rounded-lg overflow-hidden border">
                    <img id="board-preview-tag" src="" class="w-full h-full object-cover">
                    <button onclick="clearBoardImage()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">×</button>
                </div>
            </div>

            <!-- 投稿一覧 -->
            <div id="board-posts-container" class="space-y-4">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- ================= 画像保管庫 ================= -->
        <section id="tab-vault" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-700"><i class="fa-solid fa-vault"></i> 画像保管庫</h2>
                    <p class="text-xs text-slate-500">アップロードした画像を一覧・管理できます。</p>
                </div>
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-upload"></i> 画像をアップロード
                    <input type="file" accept="image/*" multiple class="hidden" onchange="uploadVaultImages(event)">
                </label>
            </div>

            <div id="vault-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- ================= バックアップ・設定 ================= -->
        <section id="tab-settings" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-700"><i class="fa-solid fa-database"></i> データバックアップ・復元</h2>
                <p class="text-xs text-slate-500">ブラウザのデータ消失を防ぐため、定期的にデータをファイルとして書き出してください。</p>
                
                <div class="flex flex-wrap gap-4 pt-2">
                    <button onclick="exportDataJSON()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> データをファイルに保存 (エクスポート)
                    </button>
                    <label class="cursor-pointer bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-file-arrow-up"></i> ファイルから復元 (インポート)
                        <input type="file" accept=".json" class="hidden" onchange="importDataJSON(event)">
                    </label>
                </div>
            </div>
        </section>

    </main>

    <!-- 小説作成モーダル -->
    <div id="novel-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-800">新規小説の作成</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">小説タイトル</label>
                <input type="text" id="modal-novel-title" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例：星空の旅人">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeNewNovelModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">キャンセル</button>
                <button onclick="createNovel()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">作成</button>
            </div>
        </div>
    </div>

    <!-- 画像拡大表示モーダル -->
    <div id="image-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closeImageModal()">
        <img id="modal-img-tag" src="" class="max-w-full max-h-full rounded-lg object-contain">
    </div>

    <!-- スクリプト部 -->
    <script>
        let appData = {
            novels: [],
            board: [],
            vault: []
        };
        let currentNovelId = null;
        let currentSceneId = null;
        let boardTempImage = null;

        const dbName = "CreatorHubDB";
        const storeName = "appStore";
        let db = null;
        let useFallback = false;

        // --- ストレージ初期化（タイムアウト付きでフリーズを完全防止） ---
        function initStorage() {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    useLocalStorageFallback();
                    resolve();
                    return;
                }

                let isResolved = false;
                // 1.5秒以内にIndexedDBが開かない場合は強制的にローカルストレージに切り替え
                const timeout = setTimeout(() => {
                    if (!isResolved) {
                        isResolved = true;
                        useLocalStorageFallback();
                        resolve();
                    }
                }, 1500);

                const request = indexedDB.open(dbName, 1);
                request.onerror = () => {
                    if (!isResolved) {
                        isResolved = true;
                        clearTimeout(timeout);
                        useLocalStorageFallback();
                        resolve();
                    }
                };
                request.onsuccess = (event) => {
                    if (!isResolved) {
                        isResolved = true;
                        clearTimeout(timeout);
                        db = event.target.result;
                        document.getElementById('storage-status').innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-emerald-300"></i> クラウド・ローカル保存';
                        loadFromDB().then(resolve).catch(() => resolve());
                    }
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(storeName)) {
                        database.createObjectStore(storeName);
                    }
                };
            });
        }

        function useLocalStorageFallback() {
            useFallback = true;
            document.getElementById('storage-status').innerHTML = '<i class="fa-solid.fa-database text-amber-300"></i> ローカル保存モード';
            try {
                const saved = localStorage.getItem('creator_hub_data_v1');
                if (saved) {
                    appData = JSON.parse(saved);
                    if (!appData.novels) appData.novels = [];
                    if (!appData.board) appData.board = [];
                    if (!appData.vault) appData.vault = [];
                }
            } catch(e) {}
            renderAll();
        }

        function saveToDB() {
            syncCurrentEditorToState();
            if (useFallback || !db) {
                try {
                    localStorage.setItem('creator_hub_data_v1', JSON.stringify(appData));
                } catch(e) {}
                return;
            }
            try {
                const transaction = db.transaction(storeName, "readwrite");
                const store = transaction.objectStore(storeName);
                store.put(appData, "mainData");
            } catch(e) {
                useLocalStorageFallback();
            }
        }

        function loadFromDB() {
            return new Promise((resolve) => {
                if (!db || useFallback) { resolve(); return; }
                try {
                    const transaction = db.transaction(storeName, "readonly");
                    const store = transaction.objectStore(storeName);
                    const request = store.get("mainData");
                    request.onsuccess = () => {
                        if (request.result) {
                            appData = request.result;
                            if (!appData.novels) appData.novels = [];
                            if (!appData.board) appData.board = [];
                            if (!appData.vault) appData.vault = [];
                        }
                        renderAll();
                        resolve();
                    };
                    request.onerror = () => { resolve(); };
                } catch(e) {
                    useLocalStorageFallback();
                    resolve();
                }
            });
        }

        // --- 画像圧縮ユーティリティ ---
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 1000;
                        const maxHeight = 1000;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // --- タブ切り替え ---
        function switchTab(tabId) {
            saveToDB();

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-white', 'text-white');
                el.classList.add('border-transparent', 'text-indigo-200');
            });

            document.getElementById(`tab-${tabId}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.add('border-white', 'text-white');
            activeBtn.classList.remove('border-transparent', 'text-indigo-200');

            if (tabId === 'novel') {
                renderNovels();
            } else if (tabId === 'board') {
                renderBoard();
            } else if (tabId === 'vault') {
                renderVault();
            }
        }

        // --- 小説スタジオ ロジック ---
        function openNewNovelModal() {
            document.getElementById('modal-novel-title').value = '';
            document.getElementById('novel-modal').classList.remove('hidden');
            document.getElementById('novel-modal').classList.add('flex');
        }
        function closeNewNovelModal() {
            document.getElementById('novel-modal').classList.remove('flex');
            document.getElementById('novel-modal').classList.add('hidden');
        }
        function createNovel() {
            const title = document.getElementById('modal-novel-title').value.trim();
            if (!title) return alert('タイトルを入力してください');

            const newNovel = {
                id: 'novel_' + Date.now(),
                title: title,
                scenes: [
                    {
                        id: 'scene_' + Date.now(),
                        title: '第1章 序幕',
                        content: '',
                        images: []
                    }
                ]
            };

            appData.novels.push(newNovel);
            saveToDB();
            closeNewNovelModal();
            openNovelEditor(newNovel.id);
        }

        function renderNovels() {
            const container = document.getElementById('novel-list-container');
            document.getElementById('novel-editor-view').classList.add('hidden');
            container.classList.remove('hidden');

            if (appData.novels.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">
                        <i class="fa-solid fa-book text-4xl mb-2"></i>
                        <p class="text-sm">作成された小説はありません。「新規小説作成」から始めましょう。</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = appData.novels.map(novel => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between gap-4">
                    <div>
                        <h3 class="font-bold text-lg text-slate-800">${escapeHTML(novel.title)}</h3>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-bookmark"></i> 場面（章）数: ${novel.scenes.length}</p>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button onclick="deleteNovel('${novel.id}')" class="text-red-500 hover:text-red-700 px-3 py-1.5 text-xs font-medium rounded border border-red-200 transition">削除</button>
                        <button onclick="openNovelEditor('${novel.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 text-xs font-medium rounded transition">編集する</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteNovel(id) {
            if (!confirm('この小説を削除しますか？')) return;
            appData.novels = appData.novels.filter(n => n.id !== id);
            saveToDB();
            renderNovels();
        }

        function openNovelEditor(novelId) {
            currentNovelId = novelId;
            const novel = appData.novels.find(n => n.id === novelId);
            if (!novel) return;

            document.getElementById('novel-list-container').classList.add('hidden');
            document.getElementById('editor-novel-title').textContent = novel.title;
            document.getElementById('novel-editor-view').classList.remove('hidden');

            if (!currentSceneId || !novel.scenes.some(s => s.id === currentSceneId)) {
                currentSceneId = novel.scenes[0].id;
            }

            renderSceneTabs();
            loadSceneToEditor(currentSceneId);
        }

        function backToNovelList() {
            saveToDB();
            currentNovelId = null;
            currentSceneId = null;
            renderNovels();
        }

        function renderSceneTabs() {
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;

            const container = document.getElementById('scene-tabs-container');
            container.innerHTML = novel.scenes.map(scene => `
                <button onclick="switchScene('${scene.id}')" class="px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap transition ${scene.id === currentSceneId ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${escapeHTML(scene.title || '無題の場面')}
                </button>
            `).join('') + `
                <button onclick="addNewScene()" class="px-3 py-2 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 whitespace-nowrap flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> 場面追加
                </button>
            `;
        }

        function addNewScene() {
            syncCurrentEditorToState();

            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;

            const newScene = {
                id: 'scene_' + Date.now(),
                title: `第${novel.scenes.length + 1}章`,
                content: '',
                images: []
            };

            novel.scenes.push(newScene);
            currentSceneId = newScene.id;
            saveToDB();
            renderSceneTabs();
            loadSceneToEditor(currentSceneId);
        }

        function switchScene(sceneId) {
            syncCurrentEditorToState();
            currentSceneId = sceneId;
            saveToDB();
            renderSceneTabs();
            loadSceneToEditor(currentSceneId);
        }

        function loadSceneToEditor(sceneId) {
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === sceneId);
            if (!scene) return;

            document.getElementById('scene-title-input').value = scene.title || '';
            document.getElementById('scene-content-input').value = scene.content || '';
            renderSceneImages(scene);
        }

        function updateActiveSceneTitle(val) {
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === currentSceneId);
            if (scene) {
                scene.title = val;
                renderSceneTabs();
            }
        }

        function updateActiveSceneContent(val) {
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === currentSceneId);
            if (scene) {
                scene.content = val;
            }
        }

        function syncCurrentEditorToState() {
            if (!currentNovelId || !currentSceneId) return;
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === currentSceneId);
            if (scene) {
                scene.title = document.getElementById('scene-title-input').value;
                scene.content = document.getElementById('scene-content-input').value;
            }
        }

        async function addSceneImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === currentSceneId);
            if (!scene) return;

            const compressedData = await compressImage(file);
            scene.images.push({
                id: 'img_' + Date.now(),
                data: compressedData
            });

            saveToDB();
            renderSceneImages(scene);
            event.target.value = '';
        }

        function renderSceneImages(scene) {
            const grid = document.getElementById('scene-images-grid');
            if (!scene.images || scene.images.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-xs text-slate-400 py-4 text-center">画像がまだありません</p>`;
                return;
            }

            grid.innerHTML = scene.images.map((img, idx) => `
                <div class="relative group aspect-square bg-slate-100 rounded-lg overflow-hidden border">
                    <img src="${img.data}" class="w-full h-full object-cover cursor-pointer" onclick="openImageModal('${img.data}')">
                    <div class="absolute inset-x-0 bottom-0 bg-black/60 p-1 flex justify-between items-center text-white text-[10px]">
                        <span>#${idx + 1}</span>
                        <button onclick="deleteSceneImage('${img.id}')" class="text-red-300 hover:text-red-100"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function deleteSceneImage(imgId) {
            const novel = appData.novels.find(n => n.id === currentNovelId);
            if (!novel) return;
            const scene = novel.scenes.find(s => s.id === currentSceneId);
            if (!scene) return;

            scene.images = scene.images.filter(img => img.id !== imgId);
            saveToDB();
            renderSceneImages(scene);
        }

        function saveCurrentNovelData() {
            saveToDB();
            alert('小説の変更内容を保存しました！');
        }


        // --- 掲示板 ロジック ---
        function previewBoardImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            compressImage(file).then(data => {
                boardTempImage = data;
                document.getElementById('board-preview-tag').src = data;
                document.getElementById('board-img-preview').classList.remove('hidden');
                document.getElementById('board-file-name').textContent = file.name;
            });
        }

        function clearBoardImage() {
            boardTempImage = null;
            document.getElementById('board-img-preview').classList.add('hidden');
            document.getElementById('board-file').value = '';
            document.getElementById('board-file-name').textContent = '';
        }

        function submitBoardPost() {
            const text = document.getElementById('board-text').value.trim();
            if (!text && !boardTempImage) return alert('文章または画像を入力してください');

            const newPost = {
                id: 'post_' + Date.now(),
                text: text,
                image: boardTempImage,
                date: new Date().toLocaleString()
            };

            appData.board.unshift(newPost);
            saveToDB();

            document.getElementById('board-text').value = '';
            clearBoardImage();
            renderBoard();
        }

        function renderBoard() {
            const container = document.getElementById('board-posts-container');
            if (appData.board.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200 text-sm">投稿はまだありません。</div>`;
                return;
            }

            container.innerHTML = appData.board.map(post => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span><i class="fa-regular fa-clock"></i> ${post.date}</span>
                        <button onclick="deleteBoardPost('${post.id}')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    ${post.text ? `<p class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">${escapeHTML(post.text)}</p>` : ''}
                    ${post.image ? `<div class="max-w-xs rounded-lg overflow-hidden border cursor-pointer"><img src="${post.image}" class="w-full object-cover" onclick="openImageModal('${post.image}')"></div>` : ''}
                </div>
            `).join('');
        }

        function deleteBoardPost(id) {
            if (!confirm('この投稿を削除しますか？')) return;
            appData.board = appData.board.filter(p => p.id !== id);
            saveToDB();
            renderBoard();
        }


        // --- 画像保管庫 ロジック ---
        async function uploadVaultImages(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                const compressed = await compressImage(file);
                appData.vault.unshift({
                    id: 'vault_' + Date.now() + Math.random(),
                    data: compressed,
                    name: file.name,
                    date: new Date().toLocaleDateString()
                });
            }

            saveToDB();
            renderVault();
            event.target.value = '';
        }

        function renderVault() {
            const grid = document.getElementById('vault-grid');
            if (appData.vault.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200 text-sm">画像が保管されていません。</div>`;
                return;
            }

            grid.innerHTML = appData.vault.map(img => `
                <div class="relative group aspect-square bg-slate-100 rounded-xl overflow-hidden border shadow-sm">
                    <img src="${img.data}" class="w-full h-full object-cover cursor-pointer" onclick="openImageModal('${img.data}')">
                    <div class="absolute inset-x-0 bottom-0 bg-black/60 p-2 flex justify-between items-center text-white text-xs">
                        <span class="truncate max-w-[120px]">${escapeHTML(img.name || '画像')}</span>
                        <button onclick="deleteVaultImage('${img.id}')" class="text-red-300 hover:text-red-100"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function deleteVaultImage(id) {
            if (!confirm('この画像を削除しますか？')) return;
            appData.vault = appData.vault.filter(img => img.id !== id);
            saveToDB();
            renderVault();
        }


        // --- バックアップ (JSON エクスポート/インポート) ---
        function exportDataJSON() {
            syncCurrentEditorToState();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `creator_hub_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && typeof parsed === 'object') {
                        appData = parsed;
                        if (!appData.novels) appData.novels = [];
                        if (!appData.board) appData.board = [];
                        if (!appData.vault) appData.vault = [];
                        saveToDB();
                        renderAll();
                        alert('データを正常に復元しました！');
                    } else {
                        alert('無効なファイル形式です');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // --- 共通ユーティリティ ---
        function renderAll() {
            renderNovels();
            renderBoard();
            renderVault();
        }

        function openImageModal(src) {
            document.getElementById('modal-img-tag').src = src;
            const modal = document.getElementById('image-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function escapeHTML(str) {
            return str.replace(/[&'`<>"]/g, (match) => ({
                '&': '&amp;',
                '\'': '&#x27;',
                '`': '&#x60;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
            }[match]));
        }

        // アプリ起動時の初期化
        window.addEventListener('DOMContentLoaded', () => {
            initStorage();
        });
    </script>
</body>
</html>
